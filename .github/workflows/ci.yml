name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so a warning fails the build here.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Includes the architecture tests, which enforce the module boundaries and
      # layering rules described in docs/ARCHITECTURE.md and ADR-0001.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
